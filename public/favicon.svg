<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    /* Detecta si el navegador está en modo claro o modo oscuro para adaptar el color base */
    .base-shape { fill: #111827; } /* Gris oscuro para modo claro */
    .accent-dot { fill: #00F0FF; } /* Cambia esto por tu color HEX exacto de 'accent' */

    @media (prefers-color-scheme: dark) {
      .base-shape { fill: #F3F4F6; } /* Blanco suave para modo oscuro */
    }
  </style>

  <!-- Contenedor / Redondeado de fondo sutil (Opcional, se puede quitar si prefieres transparencia pura) -->
  <rect width="32" height="32" rx="8" fill="#0B0F17" opacity="0.4" />

  <!-- Isotipo: Una "C" técnica/militar/geométrica -->
  <path 
    class="base-shape" 
    d="M22 8H13C10.2386 8 8 10.2386 8 13V19C8 21.7614 10.2386 24 13 24H22V21H13C11.8954 21 11 20.1046 11 19V13C11 11.8954 11.8954 11 13 11H22V8Z" 
  />

  <!-- El Nodo de Automatización / Punto de Castro.Studio -->
  <circle class="accent-dot" cx="21" cy="16" r="3" />
</svg>
